port = "${EXAMPLE_PORT:-6000}"
enabled = "${EXAMPLE_ENABLED:-true}"
label = "${EXAMPLE_NAME}"
literal = "$${EXAMPLE_NAME}"
clear = "inherited"
token = { "$env" = "EXAMPLE_TOKEN" }
text = { "$file" = "./parts/message.txt" }
