pipelines:
  daily:
    enabled: true
    stages:
      - read
      - validate
      - write
    timeoutMs: 30000
    destination:
      $include: ./destinations.json#destinations.primary
  archive:
    enabled: false
    stages:
      - read
      - compress
      - write
    timeoutMs: 45000
    destination:
      $include: ./destinations.json#destinations.secondary
